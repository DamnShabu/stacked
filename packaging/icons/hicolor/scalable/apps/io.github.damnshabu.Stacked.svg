<svg width="128" height="128" viewBox="0 0 128 128" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Stacked</title>
  <!--
    Two white blocks with a red one stacked on top, wearing Headcount's face,
    tilted the same eight degrees on the same near-black tile so the two icons
    read as one family. Square on purpose: flatpak-builder runs
    flatpak-validate-icon over everything it exports and refuses a non-square
    icon, at the very end of an otherwise successful build.
  -->
  <rect width="128" height="128" rx="28" fill="#121317"/>
  <g transform="translate(20.48 20.48) scale(0.7253) rotate(-8 60 60)">
    <rect x="12" y="62" width="46" height="46" rx="10" fill="#ffffff"/>
    <rect x="62" y="62" width="46" height="46" rx="10" fill="#ffffff"/>
    <rect x="37" y="12" width="46" height="46" rx="10" fill="#ff3d2e"/>
    <rect x="49" y="28" width="7" height="11" rx="2" fill="#121317"/>
    <rect x="64" y="28" width="7" height="11" rx="2" fill="#121317"/>
  </g>
</svg>
