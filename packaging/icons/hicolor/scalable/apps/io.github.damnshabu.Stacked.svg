<svg width="128" height="128" viewBox="0 0 128 128" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Stacked</title>
  <!--
    Three tilted tiles on a dark tile. Square on purpose: flatpak-builder runs
    flatpak-validate-icon over everything it exports and refuses a non-square
    icon, at the very end of an otherwise successful build.
  -->
  <rect width="128" height="128" rx="32" fill="#2a1f0c"/>
  <g transform="translate(16 16) scale(0.96)">
    <g transform="rotate(-14 50 50)">
      <rect x="30" y="8" width="56" height="56" rx="7" fill="#6b5634"/>
      <rect x="22" y="22" width="56" height="56" rx="7" fill="#b08c4c"/>
      <rect x="14" y="36" width="56" height="56" rx="7" fill="#e9bd6a"/>
      <rect x="35" y="57" width="14" height="14" rx="2" fill="#2a1f0c"/>
    </g>
  </g>
</svg>
