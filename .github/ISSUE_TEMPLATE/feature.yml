name: Feature or capability
description: Something Stacked should be able to do, or something a plugin should be able to ask for
labels:
  - enhancement
body:
  - type: textarea
    id: what-should-be-possible
    attributes:
      label: What should be possible
      description: Describe it from the user's side first — what someone can do afterwards that they cannot do now.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Required. Run `stacked diagnostics` in a terminal (.deb/.rpm/Arch), `flatpak run io.github.damnshabu.Stacked diagnostics` (Flatpak), `./Stacked-*.AppImage diagnostics` (AppImage), or `target/release/stacked diagnostics` (built from source). It works even when the client cannot start at all — a missing library, a GTK too old, no display — because it is answered before anything else in the process runs, which is exactly the report that most needs it.

        Seven rows, looking like this:
        ```
        Stacked   0.11.0 (0fdbb4425)
        Licence   GPL-3.0-or-later
        Install   rpm
        Roblox    2.736.1408 (fetched by Cordial)
        System    Linux host 7.1.8-200.fc44.x86_64 ... x86_64 GNU/Linux
        Distro    Fedora Linux 44
        Session   wayland (GNOME)
        ```

        It carries your hostname and your distribution's name, and no account name, session token, or profile name. You are about to paste this in public — edit the hostname out first if you would rather it not travel.
      render: text
      placeholder: Paste the output of `stacked diagnostics` here.
    validations:
      required: true

  - type: dropdown
    id: whose-job
    attributes:
      label: Whose job is it
      description: |
        Stacked is deliberately small, and most features belong outside it. If you are unsure, pick "Not sure" — getting this wrong is cheap to correct now and expensive later.
      options:
        - "A plugin — it uses capabilities that already exist"
        - "A plugin, plus a new brokered capability — Stacked has to expose an effect first"
        - "The client itself — it is about loading, rendering, input or the launcher"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: narrowest-effect
    attributes:
      label: If it needs a new capability, what is the narrowest effect that does the job
      description: |
        Stacked brokers effects and never hands over the resource behind them ([ADR-007](../../docs/adr/ADR-007-host-resources-are-brokered.md)). `presence.set` takes a presence payload; Stacked owns the Discord socket. Plugins get no socket, no D-Bus connection, no file descriptor.

        Answer with the narrowest effect that does the job — not what access would let a plugin arrange it itself. A good broker is a payload type and an effect, and adding one is a small change. If what you are describing needs a design document, that is usually a sign the capability is too broad and wants splitting. Leave this blank if the feature is not a new capability.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Things that will be declined

        Not to discourage the issue — to save you writing it:

        - Script execution against Roblox, hooking, or memory access. Absent from the API rather than disabled, and permanently out of scope ([ADR-001](../../docs/adr/ADR-001-in-process-hooking.md)).
        - A generic "open a socket" or "run a program" capability. That is the whole brokering decision undone.
        - Anything drawing on top of the running game ([ADR-009](../../docs/adr/ADR-009-capture-yes-overlay-injection-no.md)).

        Asset overlays **are** in scope and non-destructive ([ADR-010](../../docs/adr/ADR-010-plugin-asset-overlays.md)).

        ### Have you checked the ADRs

        `docs/adr/` records what was decided and why, including several decisions that were later reversed on evidence. If one of them rules this out and you think the reasoning is wrong, **say that** in the description above — argue with the ADR. ADR-004 was reversed exactly that way, by someone pointing out the reasoning did not hold.
