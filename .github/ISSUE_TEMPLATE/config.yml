# blank_issues_enabled is false so every new issue goes through one of the
# six templates above — which is where the required Diagnostics block
# lives. A blank issue cannot ask for it, and this project has already
# learned what a report without a build number or an install method costs.
blank_issues_enabled: false
contact_links:
  - name: Where to start
    url: https://github.com/DamnShabu/stacked/blob/main/docs/NEXT.md
    about: What works, what is blocking, and what has already been ruled out. Read this first.
  - name: Security issue
    url: https://github.com/DamnShabu/stacked/security/advisories/new
    about: Report privately rather than in a public issue.
  - name: Licence questions
    url: https://github.com/DamnShabu/stacked/blob/main/CONTRIBUTING.md#the-licence-is-settled
    about: Stacked is GPL-3.0-or-later and that is settled — relicensing requests are closed with a link to this, not argued. A third-party notice that is wrong or missing IS a bug and does belong in an issue.
  - name: Questions and ideas
    url: https://github.com/DamnShabu/stacked/discussions
    about: Ask, or float an idea, before it is an issue.
