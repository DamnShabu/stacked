# The 792 tests, on every push and pull request.
#
# **They ran nowhere before this.** `just test` runs them and CI did not, so the
# only thing standing between a broken test and `main` was somebody remembering
# — and this repository's own rule is that a check which only runs when asked
# for is a check that has silently stopped running.
#
# Fedora 44 in a container rather than `ubuntu-latest`. **The reason given here
# was that the workspace pins gtk4 4.22 and libadwaita 1.9, and that is no
# longer true** -- ADR-032 brought the floor down to `v4_12`/`v1_5`, which
# Ubuntu 24.04's 4.14.5 already clears. What has not been established is
# whether anything else in the workspace needs a newer base, so the container
# stays until somebody watches this job go green on an older one. The failure
# when the toolchain is too old is still worth knowing: three `*-sys` build
# scripts die with a pkg-config hint that reads as a missing package rather
# than an old one, which is a bad hour for whoever meets it first.
# `justfile`'s `build toolbox` recipe carries the same list.
#
# **Matrixed over x86_64 and aarch64, both on real hardware.** GitHub gives an
# arm64 runner (`ubuntu-24.04-arm`) free on a public repository, and
# `registry.fedoraproject.org/fedora:44` is confirmed multi-arch, so this
# costs nothing to add and is worth more than the emulated smoke test
# elsewhere in this project's toolchain: it is `cargo test` actually executing
# aarch64 code on an aarch64 CPU, not qemu standing in for one. This is
# separate from whether *Stacked itself* runs on aarch64 -- see
# docs/multiarch.md and packaging/rpm/stacked.spec's `ExclusiveArch` for that
# question, which this test matrix does not answer by itself, only exercises
# the workspace's own Rust and native code on the architecture.
name: test

on:
  push:
    branches: [main]
  pull_request:

# Read-only: neither job writes anything back to the repository.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the toolchain
        # `binutils` is not optional and not obvious: clang arrives without
        # `ar`, and CMake's static-library step then fails with "Error running
        # link command: no such file or directory", which names neither the
        # tool nor the package.
        #
        # `webkitgtk6.0-devel` and `pulseaudio-libs-devel` are here so the
        # optional features compile rather than silently taking their
        # "unavailable" arms — the shape that made web views do nothing for
        # months and audio do nothing before that.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git rust cargo clang cmake gcc-c++ binutils llvm lld \
            pkgconf-pkg-config openssl-devel \
            gtk4-devel libadwaita-devel webkitgtk6.0-devel \
            pipewire-devel pulseaudio-libs-devel alsa-lib-devel \
            wayland-devel vulkan-loader-devel libxkbcommon-devel
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: cargo test --workspace
        # Not `--all-features`: the `webview` feature is exercised separately
        # below, because enabling only one crate's half leaves the caller
        # cfg'd out and the linker collects the whole web view — the dead-code
        # shape that hid this feature being absent for months.
        run: cargo test --workspace
      - name: cargo test with the web view
        run: cargo test --workspace --features cordial-shell/webview,cordial-runtime/webview

  # The Discord issue bridge generates its modals from `.github/ISSUE_TEMPLATE/`
  # and fetches them at *runtime*, so an edit to a template needs no redeploy.
  # That moves one failure: a template edited into a shape a five-component
  # modal cannot hold now breaks in front of whoever presses the button next.
  # The bridge keeps serving the last good set when that happens, but this job
  # is how the edit is caught before it ships. See ADR-030.
  #
  # Its own job rather than a step in the one above: it needs Deno and not the
  # Rust toolchain, and there is no reason for it to queue behind a build.
  issue-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # The bridge's `yaml` comes from npm so the same import resolves under
      # Cloudflare Workers' bundler, and Deno reads it from `node_modules` --
      # so this has to run before any `deno task`.
      - name: Install the bridge's dependencies
        working-directory: tools/discord-bridge
        run: npm ci --no-audit --no-fund
      - name: Do the issue forms still fit a modal?
        working-directory: tools/discord-bridge
        run: deno task check
      - name: deno test
        working-directory: tools/discord-bridge
        run: deno task test
      - name: deno lint and fmt
        working-directory: tools/discord-bridge
        run: deno lint && deno fmt --check
