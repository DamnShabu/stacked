# Build the Flatpak and publish it as an OSTree remote on GitHub Pages, so that
#
#     flatpak remote-add --if-not-exists stacked \
#         https://damnshabu.github.io/stacked/stacked.flatpakrepo
#     flatpak install stacked io.github.damnshabu.Stacked
#
# installs Stacked without anyone building anything. Not published yet: the
# fork has not switched Pages on, so that URL 404s until it does (see
# PUBLISH_PAGES below).
#
# This header used to be marked INFERRED, on the grounds that none of it had run
# on a GitHub runner and that nobody had compiled Cordial inside the Flatpak SDK
# on any machine. Both are now false, and the correction is worth more than the
# caveat was: three consecutive green runs on 2026-08-05, and the whole workspace
# — gtk4, gdk4, gsk4, gdk4-wayland, libadwaita and all five crates — builds
# inside org.gnome.Sdk//50. The runner's apt package names and disk budget hold.
#
# What the old note claimed *had* been exercised locally is where it went wrong.
# It said signed and unsigned `.flatpakrepo` forms were both tested and that a
# signed definition over an unsigned repository was correctly refused. Whatever
# was tested, it was not the unsigned form this workflow writes: it emitted
# `GPGKey=` with an empty value, which flatpak 1.18.0 refuses outright with
# `error: Invalid gpg key`. That was only discovered once a run went green and
# the generated file existed to be added at all.
#
# Verified against Cordial's deployed remote, before the fork, not a stand-in:
# `remote-add` accepted, `remote-ls` returning the app's x86_64/master ref, and
# `install` placing both the launcher and cordial-run in /app/bin. Not
# repeated under Stacked's id.
#
# The site and the repository share one Pages deployment:
#
#     /                      site/ — the project's web page
#     /stacked.flatpakrepo   the remote definition
#     /repo/                 the OSTree repository
#
# A browser hitting the root has to get a web page, which is why the repository
# is under /repo/ rather than at the root.
#
# Nothing deploys until the repository variable PUBLISH_PAGES is set to "true"
# and Pages is switched to "GitHub Actions" in the repository settings. Until
# then this builds and uploads an artifact and stops, which is deliberate: a
# workflow that starts publishing a public remote the moment it lands is not a
# thing to spring on anyone.
#
# Two branches live in that repository, not one:
#
#     master   every push to main, exactly as before -- the edge channel
#     stable   only the commit that carries a v* release tag -- the release channel
#
# and a plain `flatpak install stacked io.github.damnshabu.Stacked`, with no
# branch named, now lands on stable rather than master, because "Update the
# repository summary" below sets xa.default-branch once stable exists. This
# is why the bug report that started this ("an installed release keeps
# following main") had a real fix: master was the only branch and the only
# default there was ever going to be. Existing master-tracking installs are
# untouched by any of this -- a remote's default branch only matters to an
# install naming none -- and are told how to move onto stable in the README
# and in packaging/stacked.flatpakrepo's own comment.
#
# The one part of this worth writing down at length: **GitHub Pages has no
# incremental publish.** `deploy` below replaces the whole site on every run
# with whatever `build` produced, and `build` hands flatpak-builder a
# repository that starts empty -- there is nothing in this workflow that
# would carry `stable` from one run to the next on its own. Left alone, the
# very first ordinary push to main after a release would publish a site with
# `master` and no `stable` at all, deleting the release channel out from under
# everyone on it. "Carry the stable channel forward, or point it at this
# release" is the step that stops that: before the summary is rewritten, it
# pulls the currently-published `stable` ref back out of the live site (the
# one this same job is about to replace) into the local repository, so an
# ordinary push carries it forward unchanged and only a tagged commit moves
# it. Verified against the real published repository on 2026-09-16 -- see
# that step's own comment for what a repository with no `stable` yet does
# instead, and see "Check whether this commit carries a release tag" for how
# a push to main is told apart from a push that also carries a tag.

name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/flatpak.yml'
      - 'Cargo.lock'
  workflow_dispatch:

# `actions: read` is for "Fetch the apt repository" in the build job below,
# which reads apt.yml's artifacts from a *different* workflow run than this
# one -- ordinary same-run artifact access does not need it.
#
# `contents: write` used to live here too, for an "Attach the bundle to the
# release" step that ran inline in the build job. That step is now the
# `publish` job below, calling the shared attach-to-release.yml -- see
# release.yml for the drift that made sharing it worth doing -- and a
# reusable workflow does not inherit permissions from the workflow around it,
# so the calling job has to grant them itself. `publish` carries its own
# `contents: write` / `id-token: write` for exactly that reason, rather than
# this block growing to cover a job that, past that one step, never wrote
# anything.
#
# **`contents: read` stays, and dropping it broke everything for a moment.**
# Declaring this block at all sets every scope not listed to `none`, not to the
# repository default -- so trimming it to `actions: read` alone left `build`
# with `contents: none`, and its very first step is `actions/checkout`, which
# authenticates with the job token and is refused rather than falling back to
# anonymous access. That is every trigger of this workflow, not the release path
# the change was about: main, every pull request, every tag. The reasoning that
# removed it was about `write` and never asked what else the same scope gated.
permissions:
  contents: read
  actions: read

# **The `flatpak-pages` concurrency group used to live here, at workflow level,
# and that was the bug that shipped two releases with no Flatpak attached.**
# It is now on the `deploy` job alone. What follows is why, because the comment
# it replaces argued the opposite and argued it from a real observation.
#
# The original reasoning: two runs exporting into the same Pages deployment
# would race, and cancelling a half-finished OSTree export is worse than
# queueing. That is still true of the deployment. It was never true of the
# build, and covering the whole workflow to protect the deploy is what did the
# damage.
#
# The old comment noted, on 2026-08-05, that "a tag pushed alongside `main`
# lands in this same group and is usually the one dropped, so `v0.5.1` has no
# build of its own", and dismissed it: "Same content, built by `main`; only the
# attribution differs." **That dismissal is wrong, and it is wrong because of a
# change made in this same file.** The bundle is attached to the GitHub release
# by the `publish` job, which is tag-only -- a `main` run never attaches
# anything. So a dropped tag run does not merely lose attribution, it loses the
# release asset, silently, with every job reporting success.
#
# Measured, not reasoned: v0.12.0 published with zero assets. v0.12.1's tag run
# 33289851652 (sha 26d151c) sat pending in this group and was cancelled when a
# push to `main` created a newer run; 33289817321 went the same way earlier the
# same day. `cancel-in-progress: false` does not prevent this -- GitHub keeps
# exactly one *pending* run per group and displaces it when a newer one joins,
# so "do not cancel" only protects a run that already started.
#
# Why the build is safe unserialised: each run exports into `--repo=repo`, a
# fresh directory in its own workspace, and never fetches the published tree.
# Two builds share no state. The `publish` job attaches to the release named by
# its own tag, so two of those cannot collide either. The deployment is the only
# shared resource in the file, and it is now the only thing queued on.
#
# `timeout-minutes: 45` on the build job stays, but it is no longer load-bearing
# for the queue: a stuck build cannot hold a group it is not in.

# **Matrixed over x86_64 and aarch64 since 2026-09-23, and this is the one part
# of that change genuinely unverified end to end.** flatpak-builder builds for
# whatever architecture the machine running it is, so pointing `build` at
# GitHub's free `ubuntu-24.04-arm` runner as well as `ubuntu-latest` produces
# an aarch64 export with no change to the recipe itself -- `uname -m` inside
# the container already returns `aarch64`, which is also exactly how OSTree
# and Flatpak spell the architecture in a ref (`app/$APP_ID/aarch64/master`),
# so that single value is read once per job and used everywhere below instead
# of a second matrix axis that could drift from it.
#
# What is genuinely new, rather than a mechanical find-and-replace of the
# literal `x86_64`, is that each matrix leg now produces its *own* local
# `repo/` -- flatpak-builder starts from empty every run, and the two legs run
# on two different machines with no shared filesystem -- and both have to end
# up served from the one OSTree tree this workflow publishes to Pages.
# Flatpak's own ref scheme (`app/$ID/$ARCH/$BRANCH`) is designed for exactly
# this: Flathub itself serves many architectures out of one repository, with
# no collision, because the architecture is part of the ref rather than a
# property of the repository as a whole. So a single shared repo correctly
# holding both architectures' refs is Flatpak's ordinary case, not a stretch.
#
# What is untested here is the *mechanics* of getting there from two separate
# local repos built on two separate runners: the `merge` job below combines
# them with `ostree pull-local`, once each, into a third repo that is what
# actually gets published. `ostree pull-local` copying refs and objects
# between two local repos with disjoint history (they share no common parent
# commit -- each leg's `master` and `stable` are their own architecture's
# lineage, not two branches of the same one) is standard OSTree usage and
# not, so far as this comment's author could establish, something that needs
# a shared ancestor to work. It has not been run against a real
# flatpak-builder export of this workspace, on either architecture, because
# authoring this change did not include running it. Treat the `merge` job as
# INFERRED until somebody watches it produce a Pages tree that both an x86_64
# and an aarch64 `flatpak install` succeed against.
#
# The published URL lives in packaging/stacked.flatpakrepo and is deliberately
# not derived from github.repository here: the Url a user's flatpak remembers
# must not change under them because the repository was renamed or forked.
# Stacked is that fork, and moved it on purpose, with the app id.
env:
  APP_ID: io.github.damnshabu.Stacked
  MANIFEST: packaging/io.github.damnshabu.Stacked.yml
  # Must name the same tree as Url in packaging/stacked.flatpakrepo -- see
  # that file's own comment for why it is not derived from github.repository.
  # "Carry the stable channel forward" below reads this exact repository back
  # in mid-build, so a rename here with no matching rename there would make
  # that step silently pull from the wrong tree, or from nothing, rather than
  # fail loudly.
  PAGES_REPO_URL: https://damnshabu.github.io/stacked/repo/

jobs:
  build:
    name: build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A ceiling, because there is a queue behind this.
    #
    # GitHub's default is six hours, and the concurrency group above means one
    # stuck run holds every later one behind it. That is not hypothetical: a run
    # hung in `apt-get` on `Install flatpak` for twenty-eight minutes and had to
    # be cancelled by hand, by which time two queued runs had been superseded and
    # dropped. Six hours of that would have looked exactly like CI being broken.
    #
    # Green runs here take seven to eleven minutes, so this is generous rather
    # than tight; anything past it is stuck rather than slow, and a failed run
    # publishes nothing while a hung one blocks everything.
    timeout-minutes: 45
    steps:
      # No submodules. The manifest pins third_party/libjnivm and
      # third_party/mcpelauncher-linker as `git` sources by commit and skips
      # them out of the `dir` source, so a recursive checkout would only be
      # copied in and then thrown away.
      #
      # fetch-tags: true is for "Check whether this commit carries a release
      # tag" below, and without it that step finds nothing regardless of
      # whether the commit is tagged. actions/checkout@v4's own default is
      # fetch-depth: 1 *and* fetch-tags: false -- confirmed by reading its
      # action.yml -- so the shallow clone this job ran with before had no
      # tag refs in it at all. Replaying its git commands locally against
      # this repository's real v0.16.0 tag showed the difference directly:
      # with the defaults, `git tag --points-at HEAD` on that commit finds
      # nothing; adding fetch-tags finds `v0.16.0`, and the extra fetch is
      # small -- tag refs only, no extra commit history -- so fetch-depth
      # stays at its default of 1 rather than growing to 0.
      #
      # **Except on a tag push, where fetch-tags breaks the checkout itself**:
      # v0.18.0's tag run failed both builds with "Cannot fetch both <sha> and
      # refs/tags/v0.18.0 to refs/tags/v0.18.0", because checkout already
      # fetches the triggering tag and fetch-tags asks for it a second time.
      # On a tag run the tag is present without it, so the step below still
      # finds it; only a push to main needs the extra tag fetch.
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-tags: ${{ github.ref_type != 'tag' }}

      # The one value every arch-specific literal in this file now reads
      # instead of spelling `x86_64` out -- see the header comment for why
      # `uname -m` is the whole of what is needed rather than a second matrix
      # axis. Set once, early, into GITHUB_ENV so every later step in this
      # job -- not just `run:` steps, `with:`/`if:` expressions too -- sees
      # `$ARCH` / `${{ env.ARCH }}` without re-deriving it.
      - name: Read this runner's architecture the way OSTree spells it
        run: echo "ARCH=$(uname -m)" >> "$GITHUB_ENV"

      # A push to main can carry a release tag on the same commit: the release
      # choreography here pushes main and the v* tag together
      # (`git push origin main <tag>`), so by the time this job's checkout
      # runs, both refs already exist server-side even though the *event*
      # that started this run was the branch push, not the tag. Only main
      # pushes reach `deploy` below -- a tag push's own ref is
      # refs/tags/v..., which that job's condition never matches -- so this
      # only needs to run, and only matters, here.
      #
      # `head -1` rather than trusting there is exactly one: two tags on the
      # same commit is possible (a hotfix re-tagged, say) and this only needs
      # one name to act on.
      - name: Check whether this commit carries a release tag
        if: github.ref == 'refs/heads/main'
        id: release
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD | grep '^v' | head -1 || true)
          if [ -n "$tag" ]; then
            echo "this commit carries $tag; stable will point at this build"
          else
            echo "no v* tag on this commit; stable is carried forward unchanged"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The runner ships with about 25 GB free and a lot of it is Android SDKs
      # and dotnet nobody here needs. The Flatpak build carries the runtime, the
      # SDK, two SDK extensions, a full cargo target directory and an OSTree
      # repository at once. INFERRED that this is necessary — if the build has
      # room to spare, delete this step rather than leaving a cargo-cult in it.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak --version
          flatpak-builder --version

      # Read from the manifest rather than repeated here, so bumping the
      # runtime is a one-line change in one file.
      #
      # Two versions, not one. The GNOME runtime carries GTK4 and libadwaita and
      # is numbered 50; the freedesktop SDK extensions it inherits are numbered
      # by the base runtime, 25.08. This step used to derive all four from
      # `runtime-version`, which asked Flathub for a rust-stable//50 that does
      # not exist — though it never got that far, because the build itself was
      # failing earlier on a runtime with no gtk4 in it.
      - name: Install the runtimes the manifest names
        run: |
          set -euo pipefail
          v=$(sed -n "s/^runtime-version: *'\(.*\)'/\1/p" "$MANIFEST")
          e=$(sed -n "s/^# sdk-extension-version: *'\(.*\)'/\1/p" "$MANIFEST")
          if [ -z "$v" ] || [ -z "$e" ]; then
            echo "::error::could not read runtime-version / sdk-extension-version from $MANIFEST"
            exit 1
          fi
          echo "runtime version: $v; sdk extension version: $e"
          flatpak remote-add --user --if-not-exists flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo
          # rust-stable is pinned to a commit, and llvm20 is not, because
          # Flathub's current rust-stable is broken on their side.
          #
          # Published 2026-08-21 02:28 UTC, commit 4d0c0a79, and it 404s on one
          # of its own objects:
          #
          #   While fetching https://dl.flathub.org/repo/objects/06/
          #   0fdf65e0a1042c0db51bf9d009048f9f07e047b422e0e736c5d8ad35ac3a9c.filez
          #   Server returned HTTP 404
          #
          # Reproduced off CI on a developer machine, so it is not the runner,
          # not the region and not this workflow. Two theories were tried and
          # both were wrong: the ref is present (`remote-info` answers, but
          # that reads summary metadata and never touches the objects, so it
          # was the wrong check), and `--no-static-deltas` made no difference
          # across three attempts.
          #
          # 385427f6 is the commit before it, from 2026-08-12, and it pulls
          # cleanly -- 325 MB, verified by hand. `flatpak install --commit` does
          # not exist and `flatpak update --commit` needs the ref installed
          # already, which is the thing that fails, so the pin goes through
          # ostree into flatpak's own repo and the install then runs offline.
          #
          # **Remove this the moment Flathub republishes.** Pinning a toolchain
          # to a three-week-old commit is a thing that quietly rots; the check
          # is whether the plain install below the pin succeeds on its own.
          flatpak install --user --noninteractive flathub \
              "org.gnome.Platform//$v" \
              "org.gnome.Sdk//$v" \
              "org.freedesktop.Sdk.Extension.llvm20//$e"

          rust_ref="runtime/org.freedesktop.Sdk.Extension.rust-stable/$ARCH/$e"
          # **This pinned commit is x86_64-specific, and that is now worth
          # saying explicitly.** It was hashed against the x86_64 build of
          # this extension on 2026-08-12; OSTree commits are per-architecture
          # objects even though the hash carries no arch in its text, so this
          # exact hash does not exist in the aarch64 leg's own commit lineage
          # and pulling it there would 404 the same way the broken *current*
          # commit does, for an unrelated reason. Rather than guess an
          # aarch64 commit that was never measured, the fallback below is
          # gated on $ARCH: on x86_64 it behaves exactly as before, and on
          # aarch64 a broken plain install fails loudly instead of silently
          # trying a pin that cannot be right.
          if flatpak install --user --noninteractive flathub \
                 "org.freedesktop.Sdk.Extension.rust-stable//$e"; then
              echo "rust-stable installed normally; the pin below is no longer needed"
          elif [ "$ARCH" = "x86_64" ]; then
              rust_pin="385427f6dabe6d297cced114496cfa6e38bb93fe4c6fbee7fdabb97dd141d29a"
              echo "::warning::rust-stable//$e will not pull from Flathub; falling back to pinned commit $rust_pin"
              ostree --repo="$HOME/.local/share/flatpak/repo" pull flathub "${rust_ref}@${rust_pin}"
              flatpak install --user --noninteractive --no-pull flathub \
                  "org.freedesktop.Sdk.Extension.rust-stable//$e"
          else
              echo "::error::rust-stable//$e will not pull from Flathub on $ARCH, and there is no pinned aarch64 commit to fall back to (see the comment above)." >&2
              exit 1
          fi

      # The build step has no network (issue #3), so every crate arrives through
      # packaging/cargo-sources.json and is fetched in flatpak-builder's download
      # phase. That list is generated from Cargo.lock and is the only thing
      # standing between a dependency bump and a build failure nobody can read,
      # so check it here rather than fifteen minutes later inside the sandbox.
      #
      # The generator is stdlib-only and deterministic: same lock file, same
      # bytes out. A diff means somebody changed Cargo.lock without rerunning it.
      - name: The vendored crate list matches Cargo.lock
        run: |
          set -euo pipefail
          python3 packaging/cargo-sources.py
          git diff --exit-code -- packaging/cargo-sources.json || {
            echo "::error::packaging/cargo-sources.json is stale. Run"
            echo "::error::  python3 packaging/cargo-sources.py"
            echo "::error::and commit the result alongside Cargo.lock."
            exit 1
          }

      # Crate downloads and the two pinned git clones, which are the same on
      # every run until Cargo.lock or the manifest changes. Not the built
      # objects — restoring a stale build cache is how a package ends up
      # shipping a binary nobody can account for.
      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-downloads-${{ hashFiles('Cargo.lock', 'packaging/io.github.damnshabu.Stacked.yml', 'packaging/cargo-sources.json') }}
          restore-keys: flatpak-downloads-

      # Absent secret means an unsigned repository, and the README says so in
      # those words. It does not mean a quietly unsigned one.
      - name: Import the signing key
        id: gpg
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          KEYID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "no FLATPAK_GPG_PRIVATE_KEY secret; the repository will be unsigned"
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          home="$RUNNER_TEMP/gnupg"
          mkdir -p "$home"
          chmod 700 "$home"
          printf '%s' "$KEY" | gpg --homedir "$home" --batch --import
          if [ -z "${KEYID:-}" ]; then
            echo "FLATPAK_GPG_PRIVATE_KEY is set but FLATPAK_GPG_KEY_ID is not" >&2
            exit 1
          fi
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "gpghome=$home" >> "$GITHUB_OUTPUT"

      - name: Build and export
        run: |
          set -euo pipefail
          args=(--force-clean --user --disable-rofiles-fuse --repo=repo)
          if [ "${{ steps.gpg.outputs.signing }}" = "true" ]; then
            args+=(--gpg-homedir="${{ steps.gpg.outputs.gpghome }}"
                   --gpg-sign="${{ secrets.FLATPAK_GPG_KEY_ID }}")
          fi
          flatpak-builder "${args[@]}" build "$MANIFEST"

      # `[profile.release] debug = true`, deliberately — the runtime is useless
      # to debug without symbols. Measured on a local build: cordial-run is
      # 178 MB unstripped against 9.5 MB stripped, and the GTK launcher that
      # `stacked` replaced 161 MB against 5.2 MB. flatpak-builder splits that into a .Debug extension, and
      # publishing it would put roughly 325 MB of symbols into a Pages site with
      # a 1 GB limit and a 100 MB per-file limit, to be downloaded by every user
      # who never asked for them. The symbols stay in the build artefacts and in
      # a local `packaging/build-flatpak.sh`; they do not go on the remote.
      - name: Drop the debug extension from the published repository
        run: |
          set -euo pipefail
          ostree --repo=repo refs
          ostree --repo=repo refs --delete "runtime/$APP_ID.Debug/$ARCH/master" || true

      # See the header comment for why this exists at all: GitHub Pages
      # replaces the whole site on every deploy, flatpak-builder only ever
      # exports `master` into a repository that starts this run empty, and
      # without this step `stable` would vanish from the published tree on
      # the very next ordinary push to main.
      #
      # --no-gpg-verify on this remote is about the pull, not the republish.
      # The objects it fetches were already built and signed by this same
      # workflow on an earlier run; re-verifying them here buys nothing, and a
      # signing-key rotation would otherwise fail this step on old objects it
      # has no actual reason to distrust. The repository this job publishes is
      # signed exactly as it already was, in the step below.
      #
      # The first run to ever reach this path -- before any tagged commit has
      # gone through it -- has no `stable` ref on the live site to pull, and
      # `ostree pull` fails with "No such branch ... in repository summary".
      # Verified locally against a repository missing the ref. That failure
      # is expected and left non-fatal: `stable` simply does not exist yet,
      # "Update the repository summary" below only sets it as the default
      # branch once it does, and the first tagged build to pass through this
      # step is what creates it.
      - name: Carry the stable channel forward, or point it at this release
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          stable_ref="app/$APP_ID/$ARCH/stable"
          master_ref="app/$APP_ID/$ARCH/master"
          ostree --repo=repo remote add --no-gpg-verify pages-live "$PAGES_REPO_URL"
          had_stable=true
          ostree --repo=repo pull pages-live "$stable_ref" || had_stable=false
          if [ -n "${{ steps.release.outputs.tag }}" ]; then
            echo "tagged build (${{ steps.release.outputs.tag }}): stable now points at this commit"
            # A new commit, not a second name for master's. Every commit
            # flatpak-builder exports carries ostree.ref-binding naming the
            # one ref it was built for, and both `flatpak install` and
            # `ostree pull` refuse a ref whose commit does not list it:
            # "Commit has no requested ref ...stable in ref binding metadata
            # (...master)". An alias made with `refs --create` broke every
            # stable install from v0.17.0's tag, and then deleted stable
            # outright on the next push, because the carry-forward pull
            # below hit the same check. Reproduced and fixed against the
            # live repository's master commit.
            commit_args=(--no-update-summary --src-ref="$master_ref")
            if [ "${{ steps.gpg.outputs.signing }}" = "true" ]; then
              commit_args+=(--gpg-homedir="${{ steps.gpg.outputs.gpghome }}"
                            --gpg-sign="${{ secrets.FLATPAK_GPG_KEY_ID }}")
            fi
            flatpak build-commit-from "${commit_args[@]}" repo "$stable_ref"
          elif [ "$had_stable" = "true" ]; then
            echo "not tagged: carrying the existing stable ref forward unchanged"
            ostree --repo=repo refs --create="$stable_ref" "pages-live:$stable_ref" --force
            ostree --repo=repo refs --delete "pages-live:$stable_ref"
          else
            echo "not tagged and no stable ref published yet: nothing to carry forward"
          fi
          ostree --repo=repo remote delete pages-live

      # Run here, per architecture, on this leg's own single-arch `repo` --
      # not only in `merge` below -- because the single-file bundle two steps
      # from now is built from this local repo before the merge job ever
      # sees it, and a summary is what lets that repo's own appstream branch
      # exist for the bundle to carry. `merge` regenerates the summary again
      # afterwards, over the combined tree, which is the one that actually
      # gets published; this run is for the bundle's benefit and is not
      # wasted even though its output here is never itself served.
      - name: Update the repository summary and appstream branch
        run: |
          set -euo pipefail
          args=(--prune)
          if [ "${{ steps.gpg.outputs.signing }}" = "true" ]; then
            args+=(--gpg-homedir="${{ steps.gpg.outputs.gpghome }}"
                   --gpg-sign="${{ secrets.FLATPAK_GPG_KEY_ID }}")
          fi
          # A plain `flatpak install` with no branch named follows this,
          # rather than defaulting to master -- verified locally against
          # flatpak 1.18.0 / libostree 2026.2: `build-update-repo
          # --default-branch=X` writes xa.default-branch into the summary,
          # and `flatpak remote-info` and `flatpak install` against a test
          # repository built the same way both resolved to X with no branch
          # named. Guarded on the ref actually existing in this run's
          # repository: the bootstrap case in the step above can leave none
          # to point at, and setting a default branch that does not exist
          # would break every install, not just new ones, rather than
          # printing the "No such branch" this is meant to avoid.
          if ostree --repo=repo rev-parse "app/$APP_ID/$ARCH/stable" >/dev/null 2>&1; then
            args+=(--default-branch=stable)
          fi
          # Without --prune and the summary rewrite the repository has objects
          # and no summary, and `flatpak install` answers "No remote refs
          # found" — which reads like a bad URL and is not one. Static deltas
          # are deliberately not generated: they make installs much faster and
          # the repository much bigger, and size is the binding constraint on
          # Pages.
          flatpak build-update-repo "${args[@]}" repo
          ostree --repo=repo refs

      # **A release with nothing to download sends everybody through the
      # unsigned remote**, which is the one step in the install this repository
      # spends four paragraphs warning people about. A single-file bundle is the
      # install with no trust decision in it:
      #
      #     flatpak install --user ./Stacked-<tag>.flatpak
      #
      # Built from the same `repo` the remote is published from, after the debug
      # extension has been dropped, so it is byte-for-byte the thing a remote
      # install would have fetched -- not a second build that might differ.
      - name: Build a single-file bundle
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME:-main}"
          # Pull-request refs such as 49/merge must not become directories.
          ref="${ref//\//-}"
          # Arch-suffixed since this leg is one of two now: without it the
          # x86_64 and aarch64 legs would both write "Stacked-${ref}.flatpak"
          # and the second upload-artifact call below would collide with the
          # first.
          out="Stacked-${ref}-${ARCH}.flatpak"
          # --arch named explicitly rather than left to build-bundle's own
          # default (the host's `uname -m`, which happens to already be
          # right here) -- this step runs on the same architecture it is
          # bundling for by construction, but naming it removes the "happens
          # to be" from that sentence.
          flatpak build-bundle repo "$out" "$APP_ID" master \
            --arch="$ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -lh "$out"
          echo "BUNDLE=$out" >> "$GITHUB_ENV"

      # Kept for every build, tag or not: a pull request that changes packaging
      # is exactly when somebody wants to install the result and try it, and
      # asking them to build it themselves is how packaging regressions reach a
      # release.
      - name: Upload the bundle as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: cordial-flatpak-bundle-${{ env.ARCH }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

      # This leg's own local repo, handed to the `merge` job below so both
      # architectures' refs end up in the one tree that actually gets
      # published -- see the header comment for why a single shared repo can
      # hold both without collision, and what about the merge itself is not
      # yet verified. Not the same thing as the bundle just uploaded: the
      # bundle is one ref packaged standalone, this is the whole local OSTree
      # repository this leg built, objects and refs together.
      - name: Upload this leg's OSTree repo, for the merge job to combine
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ env.ARCH }}
          path: repo
          if-no-files-found: error
          # A build tree, not a release artefact -- nobody downloads this by
          # hand, and it is only ever consumed by the very next job in this
          # same run. The default 90 days would just be spending storage on
          # every push for no reader.
          retention-days: 1

      # Attaching this to the release, on a tag, and signing it, is the
      # `publish` job below -- not a step here. It used to be a bare
      # `gh release upload` in this job with no create-if-missing and no
      # signing, which is the drift release.yml's own header now warns about:
      # a tag where this build finished first failed release.yml's way of
      # doing it before that job grew a create-if-missing check, and this was
      # the one artefact that never got signed. Splitting it into a separate
      # job also means it is not gated on the disk-heavy Pages assembly,
      # which now lives in the `merge` job below and which this bundle has
      # nothing to do with.

  merge:
    name: Merge both architectures' repos and assemble the Pages tree
    # Runs once, not matrixed -- combining two already-built repos is
    # architecture-agnostic work (ostree deals in content-addressed objects,
    # not in code it executes), so there is no reason to pay for an arm64
    # runner here, or to do this twice.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Only for the files "Assemble the Pages tree" below reads: the site,
      # the icons, and the two static repo-definition files. Same reasoning
      # as attach-to-release.yml's own sparse checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            site
            packaging/icons
            packaging/stacked.repo
            packaging/stacked.flatpakrepo
          sparse-checkout-cone-mode: false

      - name: Install ostree and flatpak
        # Not flatpak-builder: nothing here builds anything, it only combines
        # two already-exported repos and re-runs the summary generation
        # `flatpak build-update-repo` (the `flatpak` package's own command,
        # not flatpak-builder's) already ran once per leg in `build` above.
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      # Same step as in `build`, duplicated rather than shared, because a
      # reusable-workflow extraction for one nine-line step would be more
      # machinery than the step itself -- apt.yml, yum.yml and pacman.yml
      # already each carry their own copy of this same shape for the same
      # reason. Needed again here because the summary this job regenerates
      # over the merged tree has to be signed the same way each leg's own
      # per-arch summary already was.
      - name: Import the signing key
        id: gpg
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          KEYID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "no FLATPAK_GPG_PRIVATE_KEY secret; the repository will be unsigned"
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          home="$RUNNER_TEMP/gnupg"
          mkdir -p "$home"
          chmod 700 "$home"
          printf '%s' "$KEY" | gpg --homedir "$home" --batch --import
          if [ -z "${KEYID:-}" ]; then
            echo "FLATPAK_GPG_PRIVATE_KEY is set but FLATPAK_GPG_KEY_ID is not" >&2
            exit 1
          fi
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "gpghome=$home" >> "$GITHUB_OUTPUT"

      # One subdirectory per architecture (download-artifact's default
      # behaviour for a multi-artifact `pattern` fetch with no
      # merge-multiple) rather than flattened into one directory: unlike
      # apt's or dnf's per-arch *files*, these are two whole OSTree
      # repositories and have to stay two separate `--repo=` arguments for
      # `ostree pull-local` below, not one merged directory tree.
      - name: Download both architectures' repos
        uses: actions/download-artifact@v4
        with:
          pattern: flatpak-repo-*
          path: legs

      # **The step this whole job exists for, and the one part of this
      # change that is INFERRED rather than verified -- see the header
      # comment.** `ostree pull-local` copies refs and their objects from one
      # local repository into another; run once per leg, it leaves `merged`
      # holding both architectures' `master` and `stable` refs side by side,
      # each under its own `app/$APP_ID/<arch>/<branch>` name, which is
      # exactly the namespacing Flatpak's own ref scheme is for. `init` first
      # because `pull-local` pulls *into* an existing repository rather than
      # creating one; `--mode=archive-z2` to match what flatpak-builder's own
      # `--repo=repo` export already produced in each leg (a bare or
      # mismatched-mode destination is a real way for a local OSTree pull to
      # refuse, so this is not a formality).
      - name: Combine both architectures' repos into one
        # **Failed here on the first real run, and this is the fix, not a
        # guess: reproduced locally first.** `ostree pull-local SRC` with no
        # explicit refs enumerates `SRC/refs/remotes` to decide what to pull,
        # and `actions/upload-artifact`/`download-artifact` do not preserve
        # empty directories -- `refs/remotes` and `refs/mirrors` are always
        # empty in a repo `flatpak-builder` exports (nothing here ever adds a
        # remote to it), so the round trip through the artifact silently drops
        # them, and pull-local dies with "opendir(refs/remotes): No such file
        # or directory". Verified against a real ostree repo on this host:
        # removing those two directories reproduces the exact error, and
        # recreating them before pull-local (`mkdir -p`, a no-op if they do
        # exist) resolves it cleanly.
        run: |
          set -euo pipefail
          ostree --repo=merged init --mode=archive-z2
          for arch_dir in legs/flatpak-repo-*; do
            mkdir -p "$arch_dir/refs/remotes" "$arch_dir/refs/mirrors"
            echo "==> pulling $arch_dir into the merged repo"
            # Named refs only. Enumerating also finds the remote-tracking
            # `pages-live:app/.../stable` the stable carry-forward leaves
            # behind, which pull-local rejects as "Invalid ref name": every
            # untagged run failed that way once a stable ref existed on the
            # live site. Reproduced locally with a throwaway repository.
            mapfile -t leg_refs < <(ostree --repo="$arch_dir" refs | grep -v ':')
            ostree --repo=merged pull-local "$arch_dir" "${leg_refs[@]}"
          done
          echo "==> refs in the merged repo:"
          ostree --repo=merged refs

      # Regenerates the summary and appstream branch over the *merged* tree,
      # so the one that actually gets published describes both
      # architectures -- each leg's own run of this same command in `build`
      # only ever saw its own single-arch repo and was for that leg's bundle,
      # not for what ends up on Pages. `--default-branch=stable` is guarded
      # on any `stable` ref existing at all, for either architecture, rather
      # than naming one arch the way `build`'s own per-leg guard does: a
      # bare `flatpak install` resolves the branch name from this summary and
      # then resolves the architecture itself from the installing host, so
      # this guard only has to answer "does a stable channel exist yet",
      # not "for which architecture".
      - name: Update the merged repository's summary and appstream branch
        run: |
          set -euo pipefail
          args=(--prune)
          if [ "${{ steps.gpg.outputs.signing }}" = "true" ]; then
            args+=(--gpg-homedir="${{ steps.gpg.outputs.gpghome }}"
                   --gpg-sign="${{ secrets.FLATPAK_GPG_KEY_ID }}")
          fi
          if ostree --repo=merged refs | grep -q '/stable$'; then
            args+=(--default-branch=stable)
          fi
          flatpak build-update-repo "${args[@]}" merged
          ostree --repo=merged refs

      # apt.yml owns building this tree -- see the long comment at the top of
      # that file for why it is a separate workflow and why it stops at a
      # plain workflow artifact rather than deploying anywhere itself:
      # GitHub Pages has one deployment for the whole site, this job already
      # owns it, and a second workflow calling actions/deploy-pages would
      # replace this run's output rather than add to it.
      #
      # Consequence worth knowing rather than being surprised by: this reads
      # apt.yml's *latest successful run*, not one from this same commit, so
      # a Pages deploy can carry an apt tree that is up to one push behind
      # the flatpak repo beside it. The two workflows are independent and
      # this step does not wait for a fresh one -- waiting would mean this
      # job blocking on a second workflow_run round trip, which is a much
      # bigger change to a file this repository has already spent real
      # debugging time getting right. If that lag ever matters enough to
      # remove, the fix is apt.yml uploading straight into this job's own
      # artifact instead of a separate one, which needs the two workflows
      # merged into one.
      - name: Find the latest apt repository build
        id: aptrepo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow=apt.yml --status=success --limit=1 \
                      --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "no successful apt.yml run yet (no signing key, or it has never run); publishing without /apt/"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error rather than trusting `found` alone: apt.yml's job
      # can conclude success while building nothing at all -- its own
      # "Import the signing key" step exits 0 on a missing secret and every
      # step after it, including "Upload the repository tree", is simply
      # skipped rather than failed. A skipped step does not fail a job, so
      # `gh run list --status=success` above will happily return that run
      # long before a maintainer ever adds APT_GPG_PRIVATE_KEY, and
      # download-artifact then has no "cordial-apt-repo" to fetch from it.
      # That is a hard failure of this step (verified against the action's
      # documented behaviour for a missing artifact name, not run here since
      # it needs a real workflow run), and without continue-on-error it
      # would take the whole Pages publish down -- Flatpak repo included --
      # over an apt tree that was never expected to exist yet. The `-d
      # apt-repo` check in "Assemble the Pages tree" below already handles
      # the resulting empty directory the same way it handles `found=false`.
      - name: Download the apt repository
        if: steps.aptrepo.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cordial-apt-repo
          path: apt-repo
          github-token: ${{ github.token }}
          run-id: ${{ steps.aptrepo.outputs.run_id }}

      # yum.yml and pacman.yml own building these trees, mirroring apt.yml's
      # own two steps above exactly -- same "latest successful run" lookup,
      # same continue-on-error for the same reason: both workflows' jobs can
      # conclude success while building nothing, because every step past
      # "Import the signing key" is skipped rather than failed when the
      # matching secret is absent, and a skipped step does not fail a job.
      - name: Find the latest dnf repository build
        id: rpmrepo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow=yum.yml --status=success --limit=1 \
                      --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "no successful yum.yml run yet (no signing key, or it has never run); publishing without /rpm/"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the dnf repository
        if: steps.rpmrepo.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cordial-rpm-repo
          path: rpm-repo
          github-token: ${{ github.token }}
          run-id: ${{ steps.rpmrepo.outputs.run_id }}

      - name: Find the latest pacman repository build
        id: pacmanrepo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow=pacman.yml --status=success --limit=1 \
                      --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "no successful pacman.yml run yet (no signing key, or it has never run); publishing without /arch/"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the pacman repository
        if: steps.pacmanrepo.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cordial-pacman-repo
          path: pacman-repo
          github-token: ${{ github.token }}
          run-id: ${{ steps.pacmanrepo.outputs.run_id }}

      - name: Assemble the Pages tree
        run: |
          set -euo pipefail
          mkdir -p pages
          # The website, which lives in site/ and belongs to whoever writes it.
          # Copied if it is there and skipped without complaint if it is not, so
          # that this workflow and the site can land in either order.
          if [ -d site ] && [ -n "$(ls -A site 2>/dev/null)" ]; then
            cp -r site/. pages/
          else
            echo "site/ is absent or empty; publishing the remote without a landing page"
          fi
          # The page's icon, copied from the one the package uses rather than
          # duplicated into site/: a second copy under site/ would be the one
          # that goes stale, and nobody diffs an SVG. Named by role rather than
          # by app id, so a rename of the app does not reach into the HTML.
          #
          # This used to copy packaging/banner.svg as well, for the page header.
          # That banner is Cordial's artwork, so the page shows the application
          # icon in both places now.
          cp "packaging/icons/hicolor/scalable/apps/$APP_ID.svg" pages/favicon.svg
          mv merged pages/repo

          # The apt repository, downloaded above from apt.yml's latest green
          # run. Absent until a maintainer adds APT_GPG_PRIVATE_KEY /
          # APT_GPG_KEY_ID -- see docs/design/apt-repository.md -- at which
          # point apt.yml starts producing one and this step starts finding
          # it, with no change needed here.
          if [ -d apt-repo ] && [ -n "$(ls -A apt-repo 2>/dev/null)" ]; then
            mv apt-repo pages/apt
          else
            echo "no apt repository artifact available; publishing without /apt/"
          fi

          # The dnf repository, downloaded above from yum.yml's latest green
          # run. Absent until a maintainer adds RPM_GPG_PRIVATE_KEY /
          # RPM_GPG_KEY_ID -- see docs/design/rpm-repository.md -- at which
          # point yum.yml starts producing one and this step starts finding
          # it, with no change needed here. packaging/stacked.repo is a
          # complete, static file rather than one this step appends a key
          # line to the way it does for stacked.flatpakrepo below: its
          # gpgkey= is a URL, not an embedded key blob, so the file is
          # correct whether or not anything is at that URL yet -- it just
          # 404s honestly until yum.yml has actually signed something.
          if [ -d rpm-repo ] && [ -n "$(ls -A rpm-repo 2>/dev/null)" ]; then
            mv rpm-repo pages/rpm
          else
            echo "no dnf repository artifact available; publishing without /rpm/"
          fi
          cp packaging/stacked.repo pages/stacked.repo

          # The pacman repository, downloaded above from pacman.yml's latest
          # green run. Same absent-until-secret shape as /rpm/ above -- see
          # docs/design/pacman-repository.md.
          #
          # A pacman repository with a file over Pages' 100 MB limit is left
          # out rather than allowed to fail this job: that is what stopped
          # every Flatpak update from 2026-09-28, over a package nobody
          # installing the Flatpak needs.
          if [ -d pacman-repo ] && [ -n "$(find pacman-repo -type f -size +99M)" ]; then
            echo "::warning::pacman repository has files over 100 MB; publishing without /arch/"
            find pacman-repo -type f -size +99M
            rm -rf pacman-repo
          fi
          if [ -d pacman-repo ] && [ -n "$(ls -A pacman-repo 2>/dev/null)" ]; then
            mv pacman-repo pages/arch
          else
            echo "no pacman repository artifact available; publishing without /arch/"
          fi

          # Belt and braces. deploy-pages serves the artifact verbatim and does
          # not run Jekyll, but Jekyll skips paths beginning with _ or . and an
          # OSTree repository is not worth betting on that staying true.
          touch pages/.nojekyll

          cp packaging/stacked.flatpakrepo pages/stacked.flatpakrepo
          if [ "${{ steps.gpg.outputs.signing }}" = "true" ]; then
            gpg --homedir "${{ steps.gpg.outputs.gpghome }}" \
                --export "${{ secrets.FLATPAK_GPG_KEY_ID }}" > pages/stacked.gpg
            printf 'GPGKey=%s\n' "$(base64 -w0 < pages/stacked.gpg)" \
                >> pages/stacked.flatpakrepo
          else
            # Nothing is appended, and that is not an oversight.
            #
            # This used to write `GPGKey=` with an empty value, on the recorded
            # belief that an empty key is how a .flatpakrepo states "unsigned"
            # in a form flatpak parses, where omitting it says the same thing by
            # accident. That belief was wrong, and it was wrong in the way that
            # costs most: the file looked more careful and did not work.
            #
            # Measured against the deployed remote with flatpak 1.18.0:
            #
            #   GPGKey=      -> error: Invalid gpg key      (remote-add fails)
            #   omitted      -> accepted; gpg-verify=false,
            #                   gpg-verify-summary=false, and
            #                   the app's x86_64/master ref lists
            #                   (on Cordial's remote, before the fork)
            #
            # So an unsigned remote is expressed by the absence of the line, and
            # the README is where "this remote is unsigned" gets said to a human
            # in a form a human reads.
            echo "no signing key; the .flatpakrepo is published without a GPGKey line"
          fi

      - name: Report the payload size
        run: |
          set -euo pipefail
          du -sh pages pages/repo
          echo "largest objects:"
          find pages/repo -type f -printf '%s\t%p\n' | sort -rn | head -5
          bytes=$(du -sb pages | cut -f1)
          big=$(find pages -type f -size +99M | head -5)
          if [ -n "$big" ]; then
            echo "::error::files over GitHub Pages' 100 MB per-file limit:"
            echo "$big"
            exit 1
          fi
          # GitHub publishes 1 GB as the Pages site limit. Fail here rather than
          # at deploy, where the message is much less obvious.
          if [ "$bytes" -gt 966367641 ]; then
            echo "::error::pages tree is $(du -sh pages | cut -f1), over the 1 GB Pages limit"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  publish:
    name: Attach to the release
    # Only needs the bundle, which "Upload the bundle as a workflow artefact"
    # above produces on every run, tag or not -- this job's own `if:` below is
    # what keeps it from running (and failing on a release that should not
    # exist yet) off a tag. It deliberately does not need `deploy`: the Pages
    # publish and the release attachment share no resource, the way the long
    # comment at the top of this file already argues for the two native and
    # Flatpak workflows as a whole.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # A reusable workflow does not inherit the permissions of the workflow
    # that calls it -- see the `permissions:` block near the top of this file
    # for why `contents: write` no longer lives there now that this is the
    # only job that needs it.
    permissions:
      contents: write
      id-token: write
      # `attach-to-release.yml` dispatches the Discord announcement when it
      # is the job that created the release, and a reusable workflow cannot
      # hold a permission its caller did not grant.
      actions: write
    uses: ./.github/workflows/attach-to-release.yml
    with:
      # cordial-flatpak-bundle-* rather than the exact name: `build` is now
      # matrixed over x86_64 and aarch64 and uploads one bundle artifact per
      # arch, the same reason release.yml's own artifact_pattern is a glob.
      artifact_pattern: cordial-flatpak-bundle-*
      file_globs: '*.flatpak'
      expected_count: 2

  deploy:
    needs: merge
    # Two gates on purpose. The ref gate keeps pull requests from publishing;
    # the variable gate keeps *anything* from publishing until someone sets it,
    # which is the point at which they have also turned Pages on.
    # Tags are deliberately NOT listed, and that is a correction rather than a
    # restriction. This condition used to invite them, and every tagged release
    # then failed here after `build` had already succeeded: the `github-pages`
    # environment carries a deployment branch policy naming `main` and nothing
    # else, so a `v*` ref is refused by the environment no matter what this
    # file says. v0.6.0 is the run that showed it -- build green, deploy red,
    # for a reason invisible in the workflow.
    #
    # Publishing from `main` is not a workaround: a release commit is on main
    # too, so tagging still publishes, one run earlier. If tagged deploys are
    # ever wanted, the fix is a `v*` tag policy on the environment in repository
    # settings, and this condition should only start naming tags once that
    # exists -- a workflow that promises what the environment forbids is how
    # this stayed hidden.
    if: >-
      vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main'
    # The one genuinely shared resource in this workflow: two deployments to the
    # same Pages site race, and a half-written site is worse than a queued one.
    # Scoped to this job rather than the workflow -- see the long note above the
    # `permissions:` block for the two releases that cost. Queued rather than
    # cancelled in progress; if a newer deploy displaces an older *pending* one
    # that is correct here, because the newer tree is the one anyone wants.
    concurrency:
      group: flatpak-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
